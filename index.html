<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111315"
  >

  <meta
    name="description"
    content="365in5 - Your Microsoft cloud briefing. Everything worth knowing in five minutes."
  >

  <title>Microsoft moves fast. Keep up in five. | 365in5.com</title>

  <link
    rel="stylesheet"
    href="styles.css?v=7"
  >
</head>

<body>

  <div class="site-shell">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

      <div class="brand">

        <div
          class="brand-icon"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 64 64"
            role="img"
            aria-hidden="true"
          >
            <path
              d="M12 42h40"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />

            <path
              d="M18 37h28"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />

            <path
              d="M20 31c2-10 8-16 12-19"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />

            <path
              d="M44 31c-2-10-8-16-12-19"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />

            <path
              d="M25 9l7-5 7 5"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div class="brand-copy">

          <h1>
            365in5
          </h1>

          <p>
            Your Microsoft cloud briefing. Everything worth knowing in five minutes.
          </p>

        </div>

      </div>

      <div
        class="last-updated"
        id="lastUpdated"
        aria-live="polite"
      >

        <span
          class="last-updated-icon"
          aria-hidden="true"
        >
          ◷
        </span>

        <span>
          Waiting for latest update
        </span>

        <span
          class="status-dot"
          aria-hidden="true"
        ></span>

      </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

      <!-- ===================================================
           SUMMARY / STATUS FILTERS
           =================================================== -->

      <section
        id="summary"
        class="summary-panel"
        aria-labelledby="summaryHeading"
      >

        <h2
          id="summaryHeading"
          class="sr-only"
        >
          Brief filters
        </h2>

        <p
          id="summaryText"
          class="sr-only"
        >
          Loading...
        </p>

        <div class="summary-grid">

          <!-- ALL UPDATES -->

          <button
            class="summary-item summary-filter active"
            type="button"
            data-status="all"
            aria-pressed="true"
          >

            <div
              class="summary-icon summary-icon-updates"
              aria-hidden="true"
            >
              ▤
            </div>

            <div class="summary-content">

              <strong
                class="summary-number"
                id="summaryUpdates"
              >
                0
              </strong>

              <span class="summary-label">
                updates
              </span>

              <small class="summary-detail">
                Show everything
              </small>

            </div>

          </button>


          <!-- ACTION REQUIRED -->

          <button
            class="summary-item summary-filter"
            type="button"
            data-status="action"
            aria-pressed="false"
          >

            <div
              class="summary-icon summary-icon-action"
              aria-hidden="true"
            >
              △
            </div>

            <div class="summary-content">

              <strong
                class="summary-number"
                id="summaryActions"
              >
                0
              </strong>

              <span class="summary-label">
                require attention
              </span>

              <small class="summary-detail">
                Action required
              </small>

            </div>

          </button>


          <!-- UNREAD -->

          <button
            class="summary-item summary-filter"
            type="button"
            data-status="unread"
            aria-pressed="false"
          >

            <div
              class="summary-icon summary-icon-unread"
              aria-hidden="true"
            >
              ●
            </div>

            <div class="summary-content">

              <strong
                class="summary-number"
                id="summaryUnread"
              >
                0
              </strong>

              <span class="summary-label">
                unread
              </span>

              <small class="summary-detail">
                Still to review
              </small>

            </div>

          </button>


          <!-- READ -->

          <button
            class="summary-item summary-filter"
            type="button"
            data-status="read"
            aria-pressed="false"
          >

            <div
              class="summary-icon summary-icon-read"
              aria-hidden="true"
            >
              ✓
            </div>

            <div class="summary-content">

              <strong
                class="summary-number"
                id="summaryRead"
              >
                0
              </strong>

              <span class="summary-label">
                read
              </span>

              <small class="summary-detail">
                Already reviewed
              </small>

            </div>

          </button>

        </div>

      </section>


      <!-- ===================================================
           PRODUCT FILTERS
           =================================================== -->

      <section
        class="filter-bar"
        aria-label="Filter updates by product"
      >

        <div
          class="product-tabs"
          role="group"
          aria-label="Filter by product"
        >

          <button
            class="filter-tab active"
            type="button"
            data-product="all"
          >
            All updates
          </button>

          <button
            class="filter-tab filter-tab-entra"
            type="button"
            data-product="Entra"
          >
            Entra
          </button>

          <button
            class="filter-tab filter-tab-intune"
            type="button"
            data-product="Intune"
          >
            Intune
          </button>

          <button
            class="filter-tab filter-tab-purview"
            type="button"
            data-product="Purview"
          >
            Purview
          </button>

          <button
            class="filter-tab filter-tab-defender"
            type="button"
            data-product="Defender"
          >
            Defender
          </button>

        </div>


        <div class="filter-select-wrapper">

          <label
            class="sr-only"
            for="productFilter"
          >
            Filter by product
          </label>

          <select
            id="productFilter"
            class="product-filter"
          >

            <option value="all">
              All products
            </option>

            <option value="Entra">
              Entra
            </option>

            <option value="Intune">
              Intune
            </option>

            <option value="Purview">
              Purview
            </option>

            <option value="Defender">
              Defender
            </option>

          </select>

        </div>

      </section>


      <!-- ===================================================
           ACTIVE FILTER DESCRIPTION
           =================================================== -->

      <div
        id="activeFilterDescription"
        class="active-filter-description"
        aria-live="polite"
      >
        Showing all updates
      </div>


      <!-- ===================================================
           UPDATE FEED
           =================================================== -->

      <section
        id="feed"
        class="feed"
        aria-live="polite"
        aria-busy="true"
      >
        Loading updates...
      </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

      <div class="footer-note">

        <span
          class="footer-shield"
          aria-hidden="true"
        >
          ◈
        </span>

        <div>

          <strong>
            Microsoft official sources only
          </strong>

          <span>
            No ads. No tracking. Just signal.
          </span>

        </div>

      </div>

    </footer>

  </div>


  <!-- =======================================================
       BUY ME A COFFEE
       ======================================================= -->

  <a
    class="coffee-button"
    href="https://buymeacoffee.com/kirk"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Buy me a coffee"
  >

    <span
      class="coffee-icon"
      aria-hidden="true"
    >
      ☕
    </span>

    <span>
      Buy me a coffee
    </span>

    <span
      class="coffee-external"
      aria-hidden="true"
    >
      ↗
    </span>

  </a>


  <script src="app.js?v=7"></script>

</body>
</html>
